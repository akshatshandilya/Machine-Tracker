name: Build Android APK

on:
  push:
    branches: [main, master, machine-tracker]
    tags: ['v*']          # pushing a tag like v1.1.0 also publishes the APK as a permanent GitHub Release
  workflow_dispatch:      # lets you build any branch by hand (Actions > Run workflow > choose branch)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Gradle memory settings
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MachineTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MachineTracker-apk
          path: MachineTracker.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MachineTracker.apk
          name: Machine Tracker ${{ github.ref_name }}